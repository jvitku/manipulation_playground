services:
  dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: fvb:latest
    volumes:
      - ..:/workspace
    working_dir: /workspace
    shm_size: 2gb
    environment:
      - HOME=/tmp
    stdin_open: true
    tty: true

  # Stage 1: Stage 0 image + PyTorch, GPU passthrough. `make build-train`, `make train ...`.
  train:
    extends: dev
    image: fvb-train:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.train
    environment:
      - HOME=/tmp
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Not needed for Stage 0. Exists so later stages don't require a Docker rewrite.
  dev-gpu:
    extends: dev
    environment:
      - MUJOCO_GL=egl
      - PYOPENGL_PLATFORM=egl
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Stage 2 (PLAN §13): LeRobot + SmolVLA, Python 3.12. Never imports robosuite; talks to the sim
  # over TCP. `docker compose -f docker/compose.yaml build vla`.
  vla:
    image: fvb-vla:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.vla
    volumes:
      - ..:/workspace
    working_dir: /workspace
    shm_size: 8gb
    environment:
      - HOME=/tmp
      - HF_HOME=/workspace/outputs/hf_cache
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Experiment lab web app (lab/): FastAPI on :8430, runs training/eval subprocesses on the GPU.
  # `make lab-build`, `make lab`, `make lab-stop`. Runs as the host user so lab/data isn't root-owned.
  lab:
    image: fvb-lab:latest
    build:
      context: ..
      dockerfile: docker/Dockerfile.lab
    user: "1001:1001"
    restart: unless-stopped
    volumes:
      - ..:/workspace
    working_dir: /workspace
    shm_size: 2gb
    ports:
      - "8430:8430"
    environment:
      - HOME=/tmp
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: uvicorn lab.server.app:app --host 0.0.0.0 --port 8430
